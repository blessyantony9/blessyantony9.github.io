# Site Settings
locale                   : "en-US"
title                    : "Blessy Antony"
title_separator          : "-"
name                     : &name "Blessy Antony, Ph.D."
description              : &description "Postdoctoral Researcher at the NSF COMPASS Center, Virginia Tech"
url                      : https://blessyantony9.github.io
baseurl                  : ""
repository               : "blessyantony9.github.io"
future                   : true

# Build Settings
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true

permalink: /:categories/:title/
timezone: America/New_York

# Site Author
author:
  name             : "Blessy Antony, Ph.D."
  avatar           : "blessyantony.jpg"
  bio              : "Postdoctoral Researcher | Virginia Tech. Computational Biology, Natural Language Processing, Protein Language Models."
  location         : "Blacksburg, VA, USA"
  email            : "blessyantony@vt.edu"
  github           : "blessyantony9"
  twitter          : "blessy_antony9"
  orcid            : "https://orcid.org/0000-0002-1269-5191"
  googlescholar    : "https://scholar.google.com/citations?hl=en&authuser=1&user=nGvGIhcAAAAJ"
  pubmed           : "https://pubmed.ncbi.nlm.nih.gov/?term=Blessy+Antony"

# Reading Files
include:
  - _pages
  - files
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor
  - node_modules
keep_files:
  - .git
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Collections
collections:
  publications:
    output: true
    permalink: /publication/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  - scope:
      path: ""
      type: publications
    values:
      layout: page

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Plugins (GitHub Pages-safe)
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
